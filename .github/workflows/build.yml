name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Build
        run: lake build

      - name: Reject unproved placeholders
        run: |
          # our own sources only: .lake holds Mathlib, which legitimately
          # contains `sorry` in its test and archive files
          if grep -rnE '(^|[^[:alnum:]_])sorry([^[:alnum:]_]|$)' \
               --include='*.lean' --exclude-dir=.lake .; then
            echo "::error::an unproved placeholder is present"; exit 1
          fi
          echo "none found"

      - name: Reject new axiom declarations
        run: |
         if grep -rnE '^axiom[[:space:]]' \
               --include='*.lean' --exclude-dir=.lake .; then
            echo "::error::a new axiom is declared"; exit 1
          fi
          echo "none found"

      - name: Axiom audit
        run: lake env lean Audit.lean | tee axiom-audit.txt

      - name: Upload axiom audit
        uses: actions/upload-artifact@v4
        with:
          name: axiom-audit
          path: axiom-audit.txt
